upstream gaiamind_backend {
    least_conn;
    server web:8000;
}

# ── HTTP (desenvolvimento local / Docker interno) ─────────────────────────────
server {
    listen 80;
    server_name _;

    # Timeouts generosos para LLM responses
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    30s;

    # Buffer para respostas grandes do LLM
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;

    location / {
        proxy_pass http://gaiamind_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health  { proxy_pass http://gaiamind_backend; }
    location /metrics { proxy_pass http://gaiamind_backend; }
}

